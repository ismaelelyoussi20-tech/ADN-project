<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RNA Synthesia v3.1 | Bio-Digital Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02060a;
    --panel: rgba(5, 12, 20, 0.85);
    --primary: #00f0ff;
    --primary-glow: 0 0 25px rgba(0, 240, 255, 0.6);
    --accent: #7000ff;
    --mutation: #ff0055;
    --text: #e2e8f0;
  }

  body, html { 
    margin: 0; padding: 0; height: 100%; width: 100%; 
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif; overflow: hidden;
  }

  /* Scanline effect */
  body::after {
    content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 100;
  }

  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: grid; grid-template-columns: 350px 1fr 300px;
    pointer-events: none; z-index: 10;
  }
  .ui-layer > * { pointer-events: all; }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0, 240, 255, 0.2);
    margin: 15px; border-radius: 15px;
    padding: 20px; display: flex; flex-direction: column;
    box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05);
  }

  h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 4px; color: var(--primary); text-shadow: var(--primary-glow); }
  
  .control-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
  label { display: block; font-size: 0.6rem; color: var(--primary); text-transform: uppercase; margin-bottom: 5px; opacity: 0.8; }

  select, input[type="range"] {
    width: 100%; background: #000; color: var(--primary); border: 1px solid #1a3a4a; border-radius: 4px; padding: 5px; font-family: 'Fira Code'; outline: none;
  }

  .btn {
    padding: 15px; border-radius: 8px; border: none; cursor: pointer;
    font-weight: 900; text-transform: uppercase; transition: 0.2s;
    font-family: 'Outfit'; width: 100%;
  }
  .btn-main { background: var(--primary); color: #000; box-shadow: var(--primary-glow); margin-bottom: 10px; }
  .btn-main:active { transform: scale(0.98); }
  
  .btn-mut { background: transparent; color: var(--mutation); border: 1px solid var(--mutation); font-size: 0.7rem; margin-top: 5px; }

  .editor-box {
    position: absolute; bottom: 30px; left: 380px; right: 330px;
    background: rgba(0,0,0,0.9); border: 1px solid var(--primary);
    border-radius: 10px; padding: 15px; pointer-events: all;
  }
  textarea {
    width: 100%; height: 50px; background: transparent; border: none;
    color: var(--primary); font-family: 'Fira Code'; font-size: 1.1rem;
    resize: none; outline: none; letter-spacing: 5px;
  }

  .aa-list { overflow-y: auto; flex: 1; margin-top: 10px; }
  .aa-item {
    background: rgba(0, 240, 255, 0.03); margin-bottom: 4px; padding: 8px;
    border-radius: 4px; display: flex; justify-content: space-between;
    font-size: 0.75rem; border-left: 2px solid var(--accent);
  }
  .aa-item.active { background: var(--primary); color: #000; }

  #viewport { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
</style>
</head>
<body>

<div id="viewport"></div>

<div class="ui-layer">
  <aside class="panel">
    <h1>RNA_CORE <span style="color:#fff">v3.1</span></h1>
    <p style="font-size:0.6rem; color:var(--accent); margin-bottom:20px;">BIO-SYNTHETIC AUDIO UNIT</p>

    <div class="control-group">
      <label>Genetic Sequence</label>
      <select id="preset-select">
        <option value="oxytocin">Oxytocin</option>
        <option value="insulin">Insulin</option>
        <option value="gfp">Green Fluorescent</option>
      </select>
    </div>

    <div class="control-group">
      <label>Waveform</label>
      <select id="synth-type">
        <option value="sine">Bio-Sine (Soft)</option>
        <option value="square">Chip-Square (Hard)</option>
        <option value="sawtooth">Aggressive Saw</option>
      </select>
    </div>

    <div class="control-group">
      <label>BPM / Velocity</label>
      <input type="range" id="bpm" min="60" max="300" value="140">
    </div>

    <div style="margin-top:auto">
      <button id="btn-play" class="btn btn-main">Initialize Audio</button>
      <button id="btn-stop" class="btn" style="background:#111; color:#fff">Abort</button>
      <button class="btn btn-mut" onclick="mutate()">Inject Mutation</button>
    </div>
  </aside>

  <main></main>

  <aside class="panel">
    <label>Ribosome Status</label>
    <div id="status-display" style="font-family:'Fira Code'; font-size:0.8rem; color:var(--primary); margin-bottom:10px;">Standby</div>
    <div class="aa-list" id="aa-list"></div>
  </aside>
</div>

<div class="editor-box">
  <textarea id="rna-input" spellcheck="false"></textarea>
</div>

<script>
/** 
 * 3D ENGINE
 */
let scene, camera, renderer, proteinGroup, nodes = [];
let audioCtx, masterGain, analyser, dataArray;

function init3D() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('viewport').appendChild(renderer.domElement);

  const light = new THREE.PointLight(0x00f0ff, 2, 100);
  light.position.set(10, 10, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  proteinGroup = new THREE.Group();
  scene.add(proteinGroup);
  camera.position.z = 45;
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  proteinGroup.rotation.y += 0.005;
  if (analyser) {
    analyser.getByteFrequencyData(dataArray);
    let boost = dataArray[0] / 255;
    proteinGroup.scale.set(1+boost, 1+boost, 1+boost);
  }
  renderer.render(scene, camera);
}

function addNode(idx, type) {
  const geo = new THREE.IcosahedronGeometry(0.8, 1);
  const color = type === 'STOP' ? 0xffffff : 0x00f0ff;
  const mat = new THREE.MeshPhongMaterial({ color: color, wireframe: true });
  const mesh = new THREE.Mesh(geo, mat);
  
  const angle = idx * 0.5;
  const r = 5 + (idx * 0.2);
  mesh.position.set(Math.cos(angle)*r, idx*1.2 - 10, Math.sin(angle)*r);
  proteinGroup.add(mesh);
  nodes.push(mesh);
  camera.position.y = (idx * 1.2 - 10) / 2;
}

/** 
 * AUDIO LOGIC (FIXED)
 */
function initAudio() {
  if (audioCtx) return;
  
  // Crear contexto de audio tras interacción del usuario
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  analyser = audioCtx.createAnalyser();
  
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
  masterGain.gain.value = 0.5;
  
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  console.log("Audio Engine Ready");
}

function playNote(freq, dur) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  
  osc.type = document.getElementById('synth-type').value;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  
  osc.connect(g);
  g.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

const CODON_MAP = { AUG:'Met', UUU:'Phe', UUC:'Phe', UUA:'Leu', UUG:'Leu', UAA:'STOP', UAG:'STOP', UGA:'STOP', GGG:'Gly' }; // Simplified for demo

let isPlaying = false;
let currentIdx = 0;

function process() {
  if(!isPlaying) return;
  const rna = document.getElementById('rna-input').value.toUpperCase().replace(/[^GUAC]/g, '');
  const codons = [];
  for(let i=0; i<rna.length-2; i+=3) codons.push(rna.substr(i, 3));

  if(currentIdx < codons.length) {
    const tri = codons[currentIdx];
    const aa = CODON_MAP[tri] || 'Aa';
    const bpm = document.getElementById('bpm').value;
    const dur = 60 / bpm;

    // Frecuencia basada en la posición
    playNote(220 * (1 + (currentIdx % 12) * 0.1), dur);
    addNode(currentIdx, aa);

    document.getElementById('status-display').textContent = `Translating: ${tri}`;
    const list = document.getElementById('aa-list');
    const item = document.createElement('div');
    item.className = 'aa-item';
    item.innerHTML = `<span>${tri}</span> <b>${aa}</b>`;
    list.prepend(item);

    currentIdx++;
    setTimeout(process, dur * 1000);
  } else {
    isPlaying = false;
    document.getElementById('status-display').textContent = "Sequence Complete";
  }
}

document.getElementById('btn-play').onclick = () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  isPlaying = true;
  currentIdx = 0;
  nodes = [];
  while(proteinGroup.children.length > 0) proteinGroup.remove(proteinGroup.children[0]);
  document.getElementById('aa-list').innerHTML = '';
  process();
};

document.getElementById('btn-stop').onclick = () => {
  isPlaying = false;
  document.getElementById('status-display').textContent = "Aborted";
};

function mutate() {
  const inp = document.getElementById('rna-input');
  let v = inp.value.split('');
  v[Math.floor(Math.random()*v.length)] = ['G','U','A','C'][Math.floor(Math.random()*4)];
  inp.value = v.join('');
}

// Init
init3D();
document.getElementById('rna-input').value = "AUGUGCUACCUGCAGAAUUGCCCCCGGGGAUAA";
</script>
</body>
</html>
