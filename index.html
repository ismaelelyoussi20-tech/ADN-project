<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RNA Synthesia v3 | Bio-Music Lab</title>
<!-- Librería Three.js para Visualización 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #020408;
    --bg-surface: rgba(10, 15, 25, 0.8);
    --primary: #00f0ff;
    --primary-glow: rgba(0, 240, 255, 0.3);
    --secondary: #7000ff;
    --mutation: #ff0055;
    --text-main: #e2e8f0;
    --text-muted: #64748b;
    /* Bio-Colors */
    --prop-nonpolar: #10b981; --prop-polar: #3b82f6;
    --prop-basic: #a855f7; --prop-acidic: #ef4444;
    --prop-stop: #475569;
    --radius: 12px;
    --font-mono: 'Fira Code', monospace;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    margin: 0; overflow: hidden;
    background-image: radial-gradient(circle at 50% 50%, #0a1122 0%, #020408 100%);
  }

  /* Layout Principal */
  .app-grid {
    display: grid;
    grid-template-columns: 380px 1fr 300px;
    height: 100vh;
    gap: 1px;
    background: rgba(255,255,255,0.05);
  }

  .side-panel {
    background: var(--bg-surface);
    backdrop-filter: blur(10px);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    overflow-y: auto;
    border-right: 1px solid rgba(0, 240, 255, 0.1);
  }

  .main-viewport {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  /* 3D Container */
  #protein-viewport {
    flex: 1;
    width: 100%;
    cursor: grab;
  }

  /* Header / Stats Overlay */
  .overlay-stats {
    position: absolute;
    top: 20px; left: 20px; right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  .stat-badge {
    background: rgba(0,0,0,0.6);
    padding: 0.5rem 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--primary-glow);
    font-family: var(--font-mono);
  }

  .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
  .stat-value { font-size: 1.2rem; color: var(--primary); font-weight: bold; }

  /* Editor de RNA */
  .rna-editor-container {
    position: absolute;
    bottom: 20px; left: 20px; right: 20px;
    background: rgba(0,0,0,0.8);
    border-radius: var(--radius);
    padding: 1rem;
    border: 1px solid rgba(255,255,255,0.1);
  }

  textarea#rna-input {
    width: 100%; height: 80px;
    background: transparent; border: none;
    color: var(--primary); font-family: var(--font-mono);
    font-size: 1rem; outline: none; resize: none;
    letter-spacing: 2px;
  }

  /* UI Controls */
  .control-card {
    background: rgba(255,255,255,0.03);
    padding: 1rem; border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.05);
  }

  label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
  
  select, input[type="range"] {
    width: 100%; background: #111; color: white;
    border: 1px solid #333; padding: 0.5rem; border-radius: 6px;
  }

  .btn {
    width: 100%; padding: 0.8rem; border-radius: 8px;
    border: none; cursor: pointer; font-weight: bold;
    text-transform: uppercase; transition: 0.3s;
  }
  .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }
  .btn-primary:hover { filter: brightness(1.2); transform: scale(1.02); }
  
  .mutation-btn { background: rgba(255,0,85,0.1); color: var(--mutation); border: 1px solid var(--mutation); margin-top: 5px; font-size: 0.7rem; }
  .mutation-btn:hover { background: var(--mutation); color: white; }

  /* Amino Acid Ribbon */
  .aa-ribbon {
    height: 120px;
    background: rgba(0,0,0,0.4);
    display: flex; gap: 8px;
    padding: 10px; overflow-x: auto;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .aa-node {
    min-width: 60px; height: 100%;
    background: #111; border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 0.7rem; border-bottom: 3px solid transparent;
    transition: 0.3s;
  }
  .aa-node.active { background: #222; transform: translateY(-5px); border-color: var(--primary); }

  @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div class="app-grid">
  <!-- Panel Izquierdo: Laboratorio -->
  <aside class="side-panel">
    <h2 style="color: var(--primary); letter-spacing: 2px;">RNA SYNTHESIA v3</h2>
    
    <div class="control-card">
      <label>Proteína de Referencia</label>
      <select id="preset-select">
        <option value="oxytocin">Oxitocina</option>
        <option value="insulin">Insulina Humana</option>
        <option value="gfp">Proteína Fluorescente</option>
        <option value="endorphin">Beta-Endorfina</option>
      </select>
    </div>

    <div class="control-card">
      <label>Audio Engine</label>
      <select id="synth-type">
        <option value="ambient">Ambient Pad (Ethereal)</option>
        <option value="bass">Deep Bass (Bio-Sub)</option>
        <option value="fm">FM Crystal (Lead)</option>
      </select>
      <div style="margin-top:10px">
        <label>Master Volume</label>
        <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.7">
      </div>
    </div>

    <div class="control-card">
      <label>Propiedades de Cadena</label>
      <div style="display:flex; gap:10px">
        <div><label>Tempo</label><input type="range" id="bpm" min="40" max="220" value="100"></div>
        <div><label>Modo</label><select id="vis-mode"><option value="linear">Lineal</option><option value="helix">Hélice</option></select></div>
      </div>
    </div>

    <div class="control-card">
      <label>Mutagénesis</label>
      <button class="btn mutation-btn" onclick="applyMutation('missense')">Missense (Cambio Punto)</button>
      <button class="btn mutation-btn" onclick="applyMutation('frameshift')">Frameshift (Desplazamiento)</button>
    </div>

    <div style="margin-top:auto">
      <button id="btn-play" class="btn btn-primary">Iniciar Síntesis</button>
      <button id="btn-stop" class="btn" style="background:#333; color:white; margin-top:10px">Parar</button>
    </div>
  </aside>

  <!-- Panel Central: 3D Viewport -->
  <main class="main-viewport">
    <div class="overlay-stats">
      <div class="stat-badge">
        <div class="stat-label">Longitud Aminoácidos</div>
        <div class="stat-value" id="stat-len">0</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">GC Content</div>
        <div class="stat-value" id="stat-gc">0%</div>
      </div>
      <div class="stat-badge">
        <div class="stat-label">Codón Actual</div>
        <div class="stat-value" id="stat-codon">---</div>
      </div>
    </div>

    <div id="protein-viewport"></div>

    <div class="rna-editor-container">
      <label style="color:var(--primary)">Secuencia RNA (Editor Directo)</label>
      <textarea id="rna-input" spellcheck="false"></textarea>
    </div>
  </main>

  <!-- Panel Derecho: Secuencia -->
  <aside class="side-panel" style="border-right:none; border-left: 1px solid rgba(0, 240, 255, 0.1);">
    <label>Traducción de Polipéptidos</label>
    <div id="aa-ribbon" style="display:flex; flex-direction:column; gap:10px; overflow-y:auto; height:100%">
      <!-- AA Cards dynamic -->
    </div>
  </aside>
</div>

<script>
/** 
 * BIO-DATA TABLES 
 */
const CODON_TABLE = {
  UUU:'Phe', UUC:'Phe', UUA:'Leu', UUG:'Leu', UCU:'Ser', UCC:'Ser', UCA:'Ser', UCG:'Ser',
  UAU:'Tyr', UAC:'Tyr', UAA:'Stop', UAG:'Stop', UGU:'Cys', UGC:'Cys', UGA:'Stop', UGG:'Trp',
  CUU:'Leu', CUC:'Leu', CUA:'Leu', CUG:'Leu', CCU:'Pro', CCC:'Pro', CCA:'Pro', CCG:'Pro',
  CAU:'His', CAC:'His', CAA:'Gln', CAG:'Gln', CGU:'Arg', CGC:'Arg', CGA:'Arg', CGG:'Arg',
  AUU:'Ile', AUC:'Ile', AUA:'Ile', AUG:'Met', ACU:'Thr', ACC:'Thr', ACA:'Thr', ACG:'Thr',
  AAU:'Asn', AAC:'Asn', AAA:'Lys', AAG:'Lys', AGU:'Ser', AGC:'Ser', AGA:'Arg', AGG:'Arg',
  GUU:'Val', GUC:'Val', GUA:'Val', GUG:'Val', GCU:'Ala', GCC:'Ala', GCA:'Ala', GCG:'Ala',
  GAU:'Asp', GAC:'Asp', GAA:'Glu', GAG:'Glu', GGU:'Gly', GGC:'Gly', GGA:'Gly', GGG:'Gly'
};

const AA_PROPS = {
  'Phe': { color: 0x10b981, type: 'nonpolar' }, 'Leu': { color: 0x10b981, type: 'nonpolar' },
  'Ile': { color: 0x10b981, type: 'nonpolar' }, 'Met': { color: 0x10b981, type: 'nonpolar' },
  'Val': { color: 0x10b981, type: 'nonpolar' }, 'Ser': { color: 0x3b82f6, type: 'polar' },
  'Pro': { color: 0x10b981, type: 'nonpolar' }, 'Thr': { color: 0x3b82f6, type: 'polar' },
  'Ala': { color: 0x10b981, type: 'nonpolar' }, 'Tyr': { color: 0x3b82f6, type: 'polar' },
  'His': { color: 0xa855f7, type: 'basic' },    'Gln': { color: 0x3b82f6, type: 'polar' },
  'Asn': { color: 0x3b82f6, type: 'polar' },    'Lys': { color: 0xa855f7, type: 'basic' },
  'Asp': { color: 0xef4444, type: 'acidic' },   'Glu': { color: 0xef4444, type: 'acidic' },
  'Cys': { color: 0x3b82f6, type: 'polar' },    'Trp': { color: 0x10b981, type: 'nonpolar' },
  'Arg': { color: 0xa855f7, type: 'basic' },    'Gly': { color: 0x10b981, type: 'nonpolar' },
  'Stop': { color: 0x475569, type: 'stop' }
};

const PRESETS = {
  oxytocin: "AUGUGCUACCUGCAGAAUUGCCCCCGGGGA",
  insulin: "AUGGCCCUGUGGAUGCGCCUCCUGCCCCUGCUGGCGCUGCUGGCCCUCUGGGGACCUGACCCAGCCGCAGCCUUUGUGAACCAACACCUGUGCGGCUCACACCUGGUGGAAGCUCUCUACCUAGUGUGCGGGGAACGAGGCUUCUUCUACACACCCAAGACCCGCCGGGAGGCAGAGGACCUGCAGGUGGGGCAGGUGGAGCUGGGCGGCGGCCCUGGUGCAGGCAGCCUGCAGCCCUUGGCCCUGGAGGGGUCCCUGCAGAAGCGUGGCAUUGUGGAACAAUGCUGUACCAGCAUCUGCUCCCUCUACCAGCUGGAGAACUACUGCAACUAG",
  gfp: "AUGAGUAAAGGAGAAGAACUUUUCACUGGAGUUGUCCCAAUUCUUGUUGAUUUAGGACAAACUGCUAGAGCUGGAAAAGUAUGCAAAGGUGAAGUAAAUUUGUCAAAGAAUACUGAUCUGGAAAAUUGAAACAAUACUGAAAACGGUGUAACUAAACUA",
  endorphin: "AUGUACGGUGGUUUCAUGACCUCCGAGAAGAGCCAAACUCCUCUGGUUACUCUUAAAAAAA"
};

/**
 * 3D ENGINE (THREE.JS)
 */
let scene, camera, renderer, proteinGroup, nodes = [], lines = [];
let analyser, dataArray;

function init3D() {
  const container = document.getElementById('protein-viewport');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x00f0ff, 1);
  pointLight.position.set(10, 10, 10);
  scene.add(pointLight);

  proteinGroup = new THREE.Group();
  scene.add(proteinGroup);
  camera.position.z = 30;

  animate3D();
}

function animate3D() {
  requestAnimationFrame(animate3D);
  proteinGroup.rotation.y += 0.005;
  
  // Audio reactivity
  if(analyser) {
    analyser.getByteFrequencyData(dataArray);
    const avg = dataArray.reduce((a,b) => a+b)/dataArray.length;
    const scale = 1 + (avg / 255);
    proteinGroup.scale.set(scale, scale, scale);
  }
  
  renderer.render(scene, camera);
}

function updateProtein3D(codonIndex, codonType) {
  const prop = AA_PROPS[codonType] || AA_PROPS['Stop'];
  const geometry = new THREE.SphereGeometry(0.8, 32, 32);
  const material = new THREE.MeshPhongMaterial({ 
    color: prop.color, 
    emissive: prop.color, 
    emissiveIntensity: 0.5,
    shininess: 100 
  });
  
  const node = new THREE.Mesh(geometry, material);
  const mode = document.getElementById('vis-mode').value;
  
  let x, y, z;
  if(mode === 'linear') {
    x = (codonIndex * 2.5) - 15; y = 0; z = 0;
  } else {
    const angle = codonIndex * 0.8;
    x = Math.cos(angle) * 5;
    y = codonIndex * 1.5 - 10;
    z = Math.sin(angle) * 5;
  }
  
  node.position.set(x, y, z);
  proteinGroup.add(node);
  nodes.push(node);

  if (nodes.length > 1) {
    const prev = nodes[nodes.length - 2];
    const lineGeom = new THREE.BufferGeometry().setFromPoints([prev.position, node.position]);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
    const line = new THREE.Line(lineGeom, lineMat);
    proteinGroup.add(line);
    lines.push(line);
  }
}

/**
 * AUDIO ENGINE (WEB AUDIO API)
 */
let audioCtx, masterGain, currentSequence = [];
let isPlaying = false;
let nextNoteTime = 0;
let currentIdx = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function playNote(freq, type, time, duration) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  
  osc.type = (type === 'bass') ? 'triangle' : (type === 'ambient' ? 'sine' : 'sawtooth');
  osc.frequency.setValueAtTime(freq, time);
  
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(document.getElementById('master-vol').value * 0.3, time + 0.1);
  g.gain.exponentialRampToValueAtTime(0.001, time + duration);
  
  osc.connect(g);
  g.connect(masterGain);
  
  osc.start(time);
  osc.stop(time + duration);
}

/**
 * CORE LOGIC
 */
const dom = {
  input: document.getElementById('rna-input'),
  btnPlay: document.getElementById('btn-play'),
  btnStop: document.getElementById('btn-stop'),
  aaRibbon: document.getElementById('aa-ribbon'),
  statLen: document.getElementById('stat-len'),
  statGc: document.getElementById('stat-gc')
};

function parseRNA(seq) {
  const clean = seq.toUpperCase().replace(/[^GUAC]/g, '');
  const codons = [];
  for(let i=0; i < clean.length - 2; i+=3) {
    const triplet = clean.substr(i, 3);
    codons.push({ triplet, type: CODON_TABLE[triplet] || 'Stop' });
  }
  return codons;
}

function updateUI() {
  const seq = dom.input.value.toUpperCase();
  const gc = ((seq.match(/[GC]/g) || []).length / seq.length * 100).toFixed(1);
  dom.statGc.textContent = isNaN(gc) ? "0%" : gc + "%";
  
  const codons = parseRNA(seq);
  dom.statLen.textContent = codons.length;
  
  dom.aaRibbon.innerHTML = codons.map((c, i) => `
    <div class="aa-node" id="aa-${i}" style="border-color: #${AA_PROPS[c.type]?.color.toString(16)}">
      <b style="color:var(--primary)">${c.triplet}</b>
      <span>${c.type}</span>
    </div>
  `).join('');
}

function scheduler() {
  while (nextNoteTime < audioCtx.currentTime + 0.1 && isPlaying) {
    const codons = parseRNA(dom.input.value);
    if(currentIdx >= codons.length) { stop(); return; }
    
    const c = codons[currentIdx];
    const freq = 110 * (1 + (currentIdx % 12) * 0.1); // Lógica tonal simple basada en índice
    const type = document.getElementById('synth-type').value;
    const dur = 60 / document.getElementById('bpm').value;
    
    playNote(freq, type, nextNoteTime, dur);
    
    // Sync Visuals
    const idx = currentIdx;
    setTimeout(() => {
      document.getElementById(`aa-${idx}`)?.classList.add('active');
      document.getElementById('stat-codon').textContent = c.triplet;
      updateProtein3D(idx, c.type);
    }, (nextNoteTime - audioCtx.currentTime) * 1000);

    nextNoteTime += dur;
    currentIdx++;
  }
  if(isPlaying) requestAnimationFrame(scheduler);
}

function start() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  // Reset 3D
  while(proteinGroup.children.length > 0) proteinGroup.remove(proteinGroup.children[0]);
  nodes = []; lines = [];
  
  isPlaying = true;
  currentIdx = 0;
  nextNoteTime = audioCtx.currentTime;
  scheduler();
}

function stop() {
  isPlaying = false;
  document.querySelectorAll('.aa-node').forEach(n => n.classList.remove('active'));
}

function applyMutation(mode) {
  let seq = dom.input.value.split('');
  if(seq.length < 5) return;
  const pos = Math.floor(Math.random() * seq.length);
  
  if(mode === 'missense') {
    const bases = ['G','U','A','C'];
    seq[pos] = bases[Math.floor(Math.random()*4)];
  } else if(mode === 'frameshift') {
    seq.splice(pos, 0, 'A');
  }
  
  dom.input.value = seq.join('');
  updateUI();
}

// Eventos
dom.input.addEventListener('input', updateUI);
document.getElementById('preset-select').addEventListener('change', (e) => {
  dom.input.value = PRESETS[e.target.value];
  updateUI();
});
dom.btnPlay.addEventListener('click', start);
dom.btnStop.addEventListener('click', stop);

// Init
init3D();
dom.input.value = PRESETS.oxytocin;
updateUI();
</script>
</body>
</html>
