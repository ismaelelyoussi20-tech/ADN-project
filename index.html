<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>RNA Synthesia v5 | Folding Matrix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #00f0ff; --purple: #7000ff; --magenta: #ff0055; --bg: #030305; }
  body { margin: 0; background: var(--bg); color: #fff; font-family: 'Fira Code', monospace; overflow: hidden; }

  .ui { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; box-sizing: border-box; }
  .ui > * { pointer-events: auto; }

  .panel { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.2); padding: 15px; width: 300px; border-radius: 4px; }
  .header h1 { font-family: 'Syncopate', sans-serif; font-size: 0.9rem; letter-spacing: 5px; color: var(--cyan); margin: 0; }
  
  .btn { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid var(--cyan); background: transparent; color: var(--cyan); cursor: pointer; font-family: 'Fira Code'; font-size: 0.8rem; transition: 0.3s; }
  .btn:hover { background: var(--cyan); color: #000; }
  .btn-mut { border-color: var(--magenta); color: var(--magenta); }
  .btn-mut:hover { background: var(--magenta); color: #fff; }

  .monitor { width: 100%; max-width: 700px; background: rgba(0,0,0,0.8); border-top: 1px solid var(--purple); padding: 10px; align-self: center; }
  textarea { width: 100%; height: 40px; background: transparent; border: none; color: var(--purple); font-family: 'Fira Code'; font-size: 1rem; outline: none; resize: none; text-align: center; letter-spacing: 3px; }

  #canvas-container { position: fixed; top: 0; left: 0; z-index: 1; }
  .label { font-size: 0.6rem; color: #555; text-transform: uppercase; margin: 10px 0 5px; display: block; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui">
  <div class="panel">
    <div class="header"><h1>BIO_FOLD_V5</h1></div>
    <label class="label">Protein Database</label>
    <select id="preset-select" style="width:100%; background:#000; color:var(--cyan); border:1px solid #333; padding:5px;">
      <option value="oxytocin">Oxitocina (Corta)</option>
      <option value="insulin">Insulina (Larga)</option>
      <option value="gfp">GFP (Compleja)</option>
    </select>
    
    <button class="btn" id="start-btn" style="margin-top:15px; font-weight:bold;">EXECUTE FOLDING</button>
    
    <div style="margin-top:15px; border-top:1px solid #222;">
      <label class="label">Genetic Corruption</label>
      <button class="btn btn-mut" onclick="mutate('point')">Point Mutation</button>
      <button class="btn btn-mut" onclick="mutate('frame')">Frameshift Error</button>
    </div>
  </div>

  <div class="monitor">
    <textarea id="rna-input" spellcheck="false"></textarea>
  </div>
</div>

<script>
/** AUDIO ENGINE **/
const NOTES = { 'Met':261,'Cys':293,'Tyr':329,'Ile':349,'Gln':392,'Asn':440,'Pro':493,'Gly':523,'Phe':311,'Trp':370,'Ser':415,'Thr':466,'Arg':233,'Leu':207,'Val':196,'STOP':110,'ERR':60 };
const CODONS = { AUG:'Met',UGC:'Cys',UGU:'Cys',UAC:'Tyr',UAU:'Tyr',AUC:'Ile',AUU:'Ile',CAG:'Gln',CAA:'Gln',AAC:'Asn',AAU:'Asn',CCC:'Pro',CCU:'Pro',GGG:'Gly',UUC:'Phe',UUU:'Phe',UGG:'Trp',AGC:'Ser',AGU:'Ser',AAA:'Lys',CGU:'Arg',CUA:'Leu',GUA:'Val',UAA:'STOP' };
const SAMPLES = {
    oxytocin: "AUGUGCUACCUGCAGAAUUGCCCCCGGGGAUAA",
    insulin: "AUGGCCCUGUGGAUGCGCCUCCUGCCCCUGCUGGCGCUGCUGGCCCUCUGGGGACCUGACCCAGCCGCAGCCUUUGUGAACCAACACCUGUGCGGCUCACACCUGGUGGAAGCUCUCUACCUAGUGUGCGGGGAACGAGGCUUCUUCUACACACCCAAGACCCGCCGGGAGGCAGAGGACCUGCAGGUGGGGCAGGUGGAGCUGGGCGGCGGCCCUGGUGCAGGCAGCCUGCAGCCCUUGGCCCUGGAGGGGUCCCUGCAGAAGCGUGGCAUUGUGGAACAAUGCUGUACCAGCAUCUGCUCCCUCUACCAGCUGGAGAACUACUGCAACUAG",
    gfp: "AUGAGUAAAGGAGAAGAACUUUUCACUGGAGUUGUCCCAAUUCUUGUUGAUUUAGGACAAACUGCUAGAGCUGGAAAAGUAUGCAAAGGUGAAGUAAAUUUGUCAAAGAAUACUGAUCUGGAAAAUUGAAACAAUACUGAAAACGGUGUAACUAAACUA"
};

let audioCtx;
function playAA(aa, dur) {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = aa === 'ERR' ? 'sawtooth' : 'sine';
    osc.frequency.setValueAtTime(NOTES[aa] || 150, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

/** 3D ENGINE & SMART FOLDING **/
let scene, camera, renderer, group, nodes = [];
let lastPos = new THREE.Vector3(0,0,0);
let direction = new THREE.Vector3(1,0,0);

function init3D() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    group = new THREE.Group();
    scene.add(group);
    camera.position.z = 40;
    animate();
}

function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.002;
    renderer.render(scene, camera);
}

function foldNode(idx, aa) {
    const isErr = aa === 'ERR';
    const color = isErr ? 0xff0055 : (aa === 'STOP' ? 0xffffff : 0x00f0ff);
    const geo = new THREE.SphereGeometry(isErr ? 1.2 : 0.7, 16, 16);
    const mat = new THREE.MeshPhongMaterial({ color: color, emissive: color, emissiveIntensity: 0.3, wireframe: isErr });
    const mesh = new THREE.Mesh(geo, mat);

    // Algoritmo de plegado: Cambia de dirección cada 3-4 nodos
    if (idx % 3 === 0) {
        const axes = [new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,-1,0), new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1)];
        direction = axes[Math.floor(Math.random() * axes.length)];
    }

    const spacing = 2.5;
    const newPos = lastPos.clone().add(direction.clone().multiplyScalar(spacing));
    mesh.position.copy(newPos);
    group.add(mesh);
    nodes.push(mesh);

    if (nodes.length > 1) {
        const lineGeo = new THREE.BufferGeometry().setFromPoints([lastPos, newPos]);
        const lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
        group.add(new THREE.Line(lineGeo, lineMat));
    }

    lastPos.copy(newPos);

    // AJUSTE DE CÁMARA (Para que quepa en pantalla)
    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    
    camera.position.z = maxDim * 1.5 + 20; // Aleja la cámara según crece la proteína
    camera.lookAt(center);
    group.position.sub(center).multiplyScalar(0.1); // Centra suavemente el objeto
}

/** APP LOGIC **/
let active = false;
let step = 0;

function mutate(type) {
    let input = document.getElementById('rna-input');
    let val = input.value.split('');
    let pos = Math.floor(Math.random() * val.length);
    if(type === 'point') val[pos] = ['G','U','A','C'][Math.floor(Math.random()*4)];
    else val.splice(pos, 0, 'A');
    input.value = val.join('');
}

function process() {
    if(!active) return;
    const rna = document.getElementById('rna-input').value.toUpperCase().replace(/[^GUAC]/g, '');
    const interval = 0.4; // Segundos entre aminoácidos

    if(step * 3 < rna.length) {
        const tri = rna.substr(step * 3, 3);
        const aa = CODONS[tri] || 'ERR';
        playAA(aa, interval);
        foldNode(step, aa);
        step++;
        setTimeout(process, interval * 1000);
    } else { active = false; }
}

document.getElementById('start-btn').onclick = () => {
    if(audioCtx) audioCtx.resume();
    active = true; step = 0;
    lastPos.set(0,0,0);
    nodes = [];
    while(group.children.length > 0) group.remove(group.children[0]);
    process();
};

document.getElementById('preset-select').onchange = (e) => {
    document.getElementById('rna-input').value = SAMPLES[e.target.value];
};

window.onload = () => { init3D(); document.getElementById('rna-input').value = SAMPLES.oxytocin; };
</script>
</body>
</html>
